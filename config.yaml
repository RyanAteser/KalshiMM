# KalshiMM — Market Maker + Bonding Bot
# Tune these before going live; run backtest.py --grid first.

paper_trade: false       # Set false to place real orders
log_level: "INFO"

trading:
  series: "KXBTC15M"   # BTC 15-minute prediction markets on Kalshi
  session_duration: 900 # Seconds per contract window (15 min)
  order_size: 1        # Contracts per resting quote
  max_position: 50      # Max net YES contracts per market
  min_time_to_expiry: 120  # Stop quoting < 2 min before expiry
  loop_interval: 5.0    # Seconds between full quote refreshes

avellaneda_stoikov:
  # k controls base spread: half_spread ~ (1/gamma)*ln(1+gamma/k)
  #   k=1.5  -> ~65 cents (original default, WAY too wide for Kalshi)
  #   k=100  -> ~2 cents  (correct for 1-cent prediction market ticks)
  gamma: 0.50           # Risk aversion - skews reservation price ~1c per 10 contracts
  k: 100.0              # High arrival rate -> tight ~2-cent base spread
  min_spread: 0.01      # Hard floor (1 cent)
  max_spread: 0.06      # Hard ceiling (6 cents - widens during high vol)
  sigma_window: 100     # BTC price history window for vol estimation
  sigma_min: 0.04       # Floor: 4-cent prob-vol keeps inventory adjustment meaningful
  sigma_max: 0.30       # Cap on volatility estimate

bonding:
  target_markets: 3         # Max concurrent markets to provide liquidity in
  min_spread_to_bond: 0.01  # Skip markets with spread < 1 cent (very tight)
  min_volume: 0             # No volume floor — new markets start at 0
  rebalance_interval: 60    # Seconds between market selection refresh

risk:
  max_total_position: 200   # Combined YES exposure across all markets
  max_drawdown: 0.15        # 15% drawdown halts the bot
  max_loss_per_market: 50   # USD loss per market before pulling quotes
  daily_loss_limit: 200     # Total session loss limit in USD

# ── Kalshi KXBTC15M Mean Reversion Bot ───────────────────────────────────────
# Validate:  python mean_reversion_backtest.py
# Paper:     python mean_reversion_main.py --paper
# Live:      python mean_reversion_main.py   (needs Kalshi creds in .env)

mean_reversion:
  # Capital and sizing
  initial_capital: 1000.0    # Starting USD capital for the mean reversion bot
  position_size_pct: 0.02    # 2% of capital per trade (Kelly-conservative)

  # Edge gate — OOS bucket mean must clear this to enable trading.
  # Set ≥ 0.002 (0.2%). Raise if you want a stricter quality bar.
  min_edge: 0.002

  # Spread + gas cost per round-trip (log-return units).
  # Polymarket typical: 1-2c spread + ~$0.05 gas = ~1.5% on a $100 trade.
  # Expressed as log-return: log(1.015) ≈ 0.015.
  spread_cost: 0.015

  # Validation parameters
  min_bars: 200              # Minimum bars for robust bucket analysis
  history_days: 90           # Days of history to pull on (re)calibration
  recalibrate_days: 7        # Re-run validation every N days (weekly)
